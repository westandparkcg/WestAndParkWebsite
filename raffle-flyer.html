<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Win a $200 Gift Card — West + Park Raffle</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/wp-mark.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/raffle.css" />
</head>
<body>
  <div class="flyer-page">
    <div class="flyer-card">
      <span class="brand">
        <img class="brand-dark" src="/assets/wp-mark-reverse.png" alt="West + Park Commercial Group" />
        <img class="brand-light" src="/assets/wp-mark.png" alt="West + Park Commercial Group" />
      </span>

      <p class="flyer-kicker">Stop by our booth</p>
      <h1>Win a $200<br />Gift Card</h1>

      <div class="flyer-icon" aria-hidden="true">
        <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="18" y="10" width="48" height="30" rx="4" transform="rotate(-6 42 25)"/>
          <line x1="27" y1="21" x2="45" y2="18" transform="rotate(-6 42 25)"/>
          <line x1="27" y1="28" x2="38" y2="26.5" transform="rotate(-6 42 25)"/>
          <path d="M48 46v14"/>
          <path d="M40 52l8 10 8-10"/>
          <path d="M14 78c0-8 6-12 12-12h44c6 0 12 4 12 12"/>
          <path d="M10 78h76"/>
        </svg>
      </div>

      <p class="flyer-note">Drop your business card in the box for a chance to win — winner's choice of gift card.</p>
      <p class="flyer-fine">No purchase necessary · One entry per person · Winner announced after the show</p>
      <p class="flyer-url">westandparkcg.com</p>
    </div>
  </div>
</body>
</html>
